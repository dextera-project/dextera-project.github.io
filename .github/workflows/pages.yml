name: Publish DEXTERA to GitHub Pages

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Restore verified website
        run: |
          cat site.zip.part* > "$RUNNER_TEMP/site.zip"
          echo "8723594c33ce3b2b43b34d2316920bef1ca57816cada0f5737af2c98ba3dac88  $RUNNER_TEMP/site.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/site.zip" -d dist
          test -s dist/index.html
          test -s dist/assets/dextera-demo.mp4
          test -s dist/viewer.bundle.js
          python3 scripts/check_static_publish.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
